# Nginx 反向代理：把 https://license-videodownload.justsaysayforfun.com 转到本机 Node(8090)
# 用法见 OPERATIONS.md。先放这个 HTTP 版，再用 certbot --nginx 自动加 HTTPS。

server {
    listen 80;
    server_name license-videodownload.justsaysayforfun.com;

    # 上传/响应体放宽一点，足够 JSON 接口
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
